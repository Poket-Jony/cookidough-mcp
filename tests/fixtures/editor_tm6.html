<cr-edit-tabs
  
  class="cr-edit-tabs"
  success-message="Zutaten und Rezeptschritte wurden erfolgreich gespeichert"
  recipe-id="RECIPE_ID"
  annotate-api-url="/created-recipes/de-DE/annotate/steps"
  annotate-error-message="Ein Fehler ist aufgetreten. Bitte versuche es später erneut."
  annotate-info-message="Keine Markierungen gefunden"
  annotate-warning-message="Überprüfe die gelben Markierungen anhand der Zutatenliste"
  structured-ingredient-api="/created-recipes/de-DE/annotate/ingredients">
<cr-tts-modal>
  <cr-popover-modal delete-trigger-id="delete-tts-modal"
      delete-success-message="Koch-Einstellung wurde gelöscht" hidden>
    <span class="cr-popover-modal__arrow"></span>
    <div class="cr-popover-modal__wrapper">
      <div class="cr-popover-modal__header">
        <button class="cr-popover-modal__basket button--icon button--tertiary">
          <span class="icon icon--delete" aria-hidden="true"></span>
        </button>
        <button type="button" class="cr-popover-modal__close"></button>
        <button type="submit" class="cr-popover-modal__save button--icon button--primary" disabled>
          <span class="icon icon--checkmark" aria-hidden="true"></span>
        </button>
        <p class="cr-popover-modal__title--add">Einstellung hinzufügen</p>
        <p class="cr-popover-modal__title--edit">Einstellung bearbeiten</p>
      </div>
      <div class="cr-popover-modal__content">
        <core-content-navigation class="cr-popover-modal__navigation">
          <div class="cr-popover-modal__tablist" role="tablist" aria-label="Settings tablist">
            <button class="cr-popover-modal__tab" role="tab" aria-selected="true" aria-controls="tts-tabpanel" id="manual-tab">
              Manuell
            </button>
            <button class="cr-popover-modal__tab" role="tab" aria-selected="false" aria-controls="tts-tabpanel" id="modes-tab" tabindex="-1">
              Modi
            </button>
          </div>
          <div class="cr-popover-modal__tabpanel" role="tabpanel" aria-labelledby="manual-tab, modes-tab" id="tts-tabpanel" tabindex="0">
            <core-scrollbar>
              <div class="core-scrollbar__content">
                <core-accordion class="cr-tts-modal__sections">
                  <cr-tts-mode hidden>
  <cr-select-input>
    <core-expand class="cr-select-input__expand" animation-time="0.4">
      <button class="core-expand__header" aria-expanded="false" aria-controls="setting-panel">
        <p class="icon" aria-hidden="true"></p>
        <p class="core-expand__title"></p>
      </button>
      <div class="core-expand__content">
        <div class="cr-select-input__radio-group cr-select-input__radio-group--list cr-select-input__radio-group--list-separated">
            <input type="radio" id="mode-radio-dough" name="mode" value="dough" checked header-title="Teig kneten" header-icon="dough">
            <label   for="mode-radio-dough"><span class='icon icon--dough' aria-hidden='true'></span>Teig kneten</label>
            <input type="radio" id="mode-radio-browning" name="mode" value="browning"  header-title="Anbraten" header-icon="temperature-high">
            <label tm7-mode  for="mode-radio-browning"><span class='icon icon--temperature-high' aria-hidden='true'></span>Anbraten</label>
            <input type="radio" id="mode-radio-turbo" name="mode" value="turbo"  header-title="Turbo" header-icon="turbo">
            <label   for="mode-radio-turbo"><span class='icon icon--turbo' aria-hidden='true'></span>Turbo</label>
            <input type="radio" id="mode-radio-steaming" name="mode" value="steaming"  header-title="Dampfgaren" header-icon="steaming">
            <label tm7-mode  for="mode-radio-steaming"><span class='icon icon--steaming' aria-hidden='true'></span>Dampfgaren</label>
            <input type="radio" id="mode-radio-blend" name="mode" value="blend"  header-title="Pürieren" header-icon="cold-blending">
            <label   for="mode-radio-blend"><span class='icon icon--cold-blending' aria-hidden='true'></span>Pürieren</label>
            <input type="radio" id="mode-radio-warm-up" name="mode" value="warm_up"  header-title="Erwärmen" header-icon="warm-up">
            <label   for="mode-radio-warm-up"><span class='icon icon--warm-up' aria-hidden='true'></span>Erwärmen</label>
            <input type="radio" id="mode-radio-rice-cooker" name="mode" value="rice_cooker"  header-title="Reis kochen" header-icon="boiled-rice">
            <label   for="mode-radio-rice-cooker"><span class='icon icon--boiled-rice' aria-hidden='true'></span>Reis kochen</label>
        </div>
      </div>
    </core-expand>
  </cr-select-input>
  <hr class="separator--silver-20">
</cr-tts-mode>
                  <cr-tts-time
  hidden
  class="cr-popover-modal__time"
  minutes-translation="Min."
  seconds-translation="Sek."
  adjust-time-message="Die Zeit wurde auf die nächste zulässige Kombination korrigiert.">
  <div class="cr-popover-modal__input">
    <label>Min.</label>
    <input placeholder="0" type="number" inputmode="numeric" aria-describedby="minutes">
  </div>
  <div class="cr-popover-modal__input">
    <label>Sek.</label>
    <input placeholder="0" type="number" inputmode="numeric" aria-describedby="seconds">
  </div>
  <cr-select-input>
    <core-expand class="cr-select-input__expand" animation-time="0.4">
      <button class="core-expand__header" aria-expanded="false" aria-controls="setting-panel">
        <p class="icon" aria-hidden="true"></p>
        <p class="core-expand__title"></p>
      </button>
      <div class="core-expand__content">
        <div class="cr-select-input__radio-group cr-select-input__radio-group--list">
          <input type="radio" id="time-radio-0.5" name="time" value="0.5" header-title="0.5 Sek." checked>
          <label for="time-radio-0.5">0.5 Sek.</label>
          <input type="radio" id="time-radio-1" name="time" value="1" header-title="1 Sek.">
          <label for="time-radio-1">1 Sek.</label>
          <input type="radio" id="time-radio-2" name="time" value="2" header-title="2 Sek.">
          <label for="time-radio-2">2 Sek.</label>
        </div>
      </div>
    </core-expand>
  </cr-select-input>
</cr-tts-time>
