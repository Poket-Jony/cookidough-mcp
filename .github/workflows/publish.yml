# Release: bump the version in pyproject.toml and server.json (twice), then push a
# matching tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`. The quality gates
# run, the package goes to PyPI via trusted publishing (no token) and the server
# metadata to the official MCP Registry via GitHub OIDC (no token).
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Quality gates and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that tag, pyproject.toml and server.json agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          SERVER=$(jq -r '.version' server.json)
          PACKAGE=$(jq -r '.packages[0].version' server.json)
          echo "tag=$TAG pyproject=$PYPROJECT server.json=$SERVER package=$PACKAGE"
          test "$TAG" = "$PYPROJECT" && test "$TAG" = "$SERVER" && test "$TAG" = "$PACKAGE"

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Run all quality gates
        run: ./check.sh

      - name: Build distributions
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    name: Publish to the MCP Registry
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # The registry validates the package against PyPI, which needs a moment
      # to serve a freshly uploaded release.
      - name: Wait until PyPI serves the new version
        run: |
          VERSION=$(jq -r '.version' server.json)
          for _ in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/cookidough-mcp/$VERSION/json" > /dev/null && exit 0
            sleep 10
          done
          echo "Version $VERSION did not appear on PyPI" && exit 1

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
